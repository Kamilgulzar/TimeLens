appId: com.timelens.desktop
productName: TimeLens
copyright: Copyright 2026 TimeLens

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"

protocols:
  name: TimeLens Protocol
  schemes:
    - timelens

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TimeLens

publish:
  provider: generic
  url: https://example.com/updates

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimeLens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img class="brand-mark" src="../icons/icon128.png" alt="" />
        <span class="brand-name">TimeLens</span>
      </div>
      <span class="status-pill" id="status-pill" data-state="off">Not signed in</span>
    </header>

    <main>
      <section class="view" id="view-connect" hidden>
        <div class="connect-head">
          <h1>Track your time</h1>
          <p class="sub">Quietly measure where your hours go. Nothing leaves this device until you do.</p>
        </div>
        <form id="connect-form" novalidate>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" id="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="field">
            <span class="field-label">Password</span>
            <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required />
          </label>
          <button class="btn btn-primary" id="connect-btn" type="submit">Sign in</button>
          <p class="form-error" id="connect-error" hidden></p>
        </form>

        <div class="oauth-divider">
          <span class="oauth-divider-text">or</span>
        </div>

        <button class="btn btn-oauth" id="google-btn" type="button">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06L5.84 9.9c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>
        <button class="btn btn-oauth" id="github-btn" type="button">
          <svg class="oauth-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.91c.58.11.79-.25.79-.55v-2.13c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.34.95.11-.74.4-1.25.73-1.53-2.55-.29-5.23-1.28-5.23-5.67 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a11 11 0 0 1 5.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.08 0 4.4-2.69 5.37-5.25 5.66.41.35.77 1.05.77 2.12v3.14c0 .3.2.66.8.55A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>
          Continue with GitHub
        </button>
      </section>

      <section class="view" id="view-track" hidden>
        <div class="card" id="track-card">
          <div class="card-top">
            <div class="card-title">
              <p class="eyebrow" id="track-status">Tracking</p>
              <h2 class="domain" id="track-domain">—</h2>
            </div>
            <span class="chip" id="track-category">—</span>
          </div>
          <p class="timer" id="track-timer">00:00</p>
          <p class="hint" id="track-hint">Only active time counts — idle never adds up.</p>
        </div>

        <div class="row">
          <div>
            <p class="row-label">Tracking</p>
            <p class="row-sub" id="toggle-sub">Watch the current tab and count the time</p>
          </div>
          <button class="switch" id="toggle-btn" role="switch" aria-checked="true" aria-label="Toggle tracking"></button>
        </div>

        <div class="sync-row" id="sync-row">
          <span class="sync-dot" id="sync-dot"></span>
          <span class="sync-text" id="sync-text">Synced</span>
        </div>

        <div class="actions">
          <button class="btn btn-secondary" id="sync-btn">Sync now</button>
          <button class="btn btn-ghost" id="signout-btn">Sign out</button>
        </div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
